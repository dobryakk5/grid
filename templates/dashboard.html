<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grid Bot</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0e14;--panel:#121722;--line:#273044;--text:#e6eaf2;--muted:#8e9aaf;--good:#58d68d;--bad:#ff6b6b;--accent:#6ea8fe}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}.wrap{max-width:1240px;margin:auto;padding:28px 20px 60px}.top,.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.top{margin-bottom:24px}h1,h2{margin:0}.price{font-size:22px;font-weight:700;text-align:right}.price small{display:block;color:var(--muted);font-size:11px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}.profiles{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.profile-name,button,.button{border:1px solid var(--line);background:#171d2a;color:var(--text);padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:650;text-decoration:none}.profile-name.selected,.primary{border-color:var(--accent);background:#1c4d8f}.muted{color:var(--muted)}.empty{padding:22px;text-align:center;color:var(--muted)}.error,.bad{color:var(--bad)}.good,.side-buy{color:var(--good)}.side-sell{color:var(--bad)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid #202838;white-space:nowrap}th{font-size:11px;color:var(--muted);background:#0e131d}.cancel-order{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;padding:3px 8px}.cancel-order:hover{color:var(--bad)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-top:14px}.box{background:#0e131d;border:1px solid #202838;border-radius:9px;padding:11px}.box span{display:block;color:var(--muted);font-size:11px}.box b{font-size:16px}.hidden{display:none}@media(max-width:600px){.top{align-items:flex-start}.price{font-size:16px}.section-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><div class="wrap">
  <header class="top"><h1>Grid Bot</h1><div style="display:flex;align-items:center;gap:14px"><a class="button primary" href="profiles/new">Создать профиль</a><div class="price"><small>BTCUSDT сейчас</small><span id="btcPrice">—</span></div></div></header>

  <section class="panel"><div class="section-head"><h2>Работающие профили</h2><span class="muted" id="profileCount"></span></div><div id="profiles" class="profiles"></div></section>

  <section id="details" class="hidden">
    <div class="panel"><div class="section-head"><h2 id="pnlTitle">Результат</h2><button id="stopBtn">Stop</button></div><div id="pnl"></div></div>
    <div class="panel"><div class="section-head"><h2 id="ordersTitle">Заявки и сделки</h2><button id="refreshBtn">Обновить</button></div><div id="orders"></div></div>
  </section>
</div><script>
let profiles=[],selectedId=null;const $=id=>document.getElementById(id);const money=v=>Number(v).toLocaleString('ru-RU',{maximumFractionDigits:8});const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);return d}
async function loadPrice(){try{const p=await api('/api/price/BTCUSDT');$('btcPrice').textContent=money(p.last_price)+' USDT'}catch{$('btcPrice').textContent='нет связи'}}
function renderProfiles(){const root=$('profiles');$('profileCount').textContent=profiles.length?`${profiles.length}`:'';if(!profiles.length){root.innerHTML='<div class="empty">Нет работающих профилей. Создайте или запустите профиль.</div>';$('details').classList.add('hidden');return}root.innerHTML=profiles.map(p=>`<button class="profile-name ${p.id===selectedId?'selected':''}" onclick="selectProfile(${p.id})">${esc(p.name)} · DEMO · ${esc(p.regime_state)}</button>`).join('')}
async function loadProfiles(){try{profiles=(await api('/api/profiles')).filter(p=>p.enabled);if(!profiles.some(p=>p.id===selectedId))selectedId=profiles[0]?.id||null;renderProfiles();if(selectedId)await loadDetails()}catch(e){$('profiles').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function selectProfile(id){selectedId=id;renderProfiles();await loadDetails()}
async function loadDetails(){const p=profiles.find(x=>x.id===selectedId);if(!p)return;$('details').classList.remove('hidden');$('pnlTitle').textContent=p.name;$('ordersTitle').textContent=`Заявки и сделки · ${p.name}`;await Promise.all([loadPnl(),loadOrders()])}
async function loadPnl(){try{const d=await api(`/api/profiles/${selectedId}/pnl`),t=d.total;$('pnl').innerHTML=`<div class="summary"><div class="box"><span>Циклов</span><b>${t.cycles}</b></div><div class="box"><span>Realized PnL</span><b>${money(t.realized_pnl)}</b></div><div class="box"><span>Unrealized PnL</span><b>${money(t.unrealized_pnl)}</b></div><div class="box"><span>Total PnL</span><b class="${Number(t.total_pnl)>=0?'good':'bad'}">${money(t.total_pnl)}</b></div><div class="box"><span>Комиссии</span><b>${money(t.fees_quote)}</b></div><div class="box"><span>BTC inventory</span><b>${money(t.base_inventory)}</b></div></div><div class="table-wrap"><table><thead><tr><th>Ячейка</th><th>Состояние</th><th>Циклов</th><th>Net</th></tr></thead><tbody>${d.cells.map(c=>`<tr><td>${money(c.buy_price)} → ${money(c.sell_price)}</td><td>${esc(c.state)}</td><td>${c.cycles}</td><td>${money(c.net_profit)}</td></tr>`).join('')}</tbody></table></div>`}catch(e){$('pnl').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function loadOrders(){try{const rows=await api(`/api/profiles/${selectedId}/orders?limit=150`);$('orders').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Время</th><th>Тип</th><th>Роль</th><th>Цена</th><th>Количество</th><th>Статус</th><th></th></tr></thead><tbody>${rows.map(o=>`<tr><td>${new Date(o.updated_at||o.created_at).toLocaleString('ru-RU')}</td><td class="${o.side==='Buy'?'side-buy':'side-sell'}">${o.side.toUpperCase()}</td><td>${esc(o.order_role)}</td><td>${money(o.price)}</td><td>${money(o.filled_qty||o.qty)}</td><td>${esc(o.status)}</td><td>${['New','Untriggered','Created'].includes(o.status)?`<button class="cancel-order" title="Отменить заявку" onclick="cancelOrder(${o.id})">×</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Заявок пока нет</div>'}catch(e){$('orders').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function cancelOrder(orderId){if(!confirm('Отменить эту заявку?'))return;try{await api(`/api/profiles/${selectedId}/orders/${orderId}/cancel`,{method:'POST'});await loadOrders()}catch(e){alert(e.message)}}
$('refreshBtn').onclick=loadProfiles;$('stopBtn').onclick=async()=>{await api(`/api/profiles/${selectedId}/stop`,{method:'POST'});await loadProfiles()};loadPrice();loadProfiles();setInterval(loadPrice,10000);setInterval(loadProfiles,5000);
</script></body></html>
