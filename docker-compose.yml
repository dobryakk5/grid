services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grid
      POSTGRES_USER: grid
      POSTGRES_PASSWORD: grid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grid -d grid"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.workers.grid
    restart: unless-stopped

volumes:
  pgdata:
