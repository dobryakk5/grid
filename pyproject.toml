[project]
name = "mini-grid-bot"
version = "0.6.0"
description = "Minimal FastAPI + PostgreSQL spot grid bot for Bybit Demo, without Docker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
