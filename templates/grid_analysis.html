<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Исследование монеты · Grid Bot</title><style>
:root{color-scheme:dark;--bg:#0b0e14;--panel:#121722;--line:#273044;--text:#e6eaf2;--muted:#8e9aaf;--good:#58d68d;--bad:#ff6b6b;--accent:#6ea8fe;--warn:#f6c85f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 20px 60px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}h1,h2,h3{margin:0}.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.button,button{border:1px solid var(--line);background:#171d2a;color:var(--text);padding:10px 14px;border-radius:9px;text-decoration:none;font-weight:650;cursor:pointer}.primary{background:#1c4d8f;border-color:var(--accent)}.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.metric{background:#0e131d;border:1px solid #202838;border-radius:10px;padding:13px}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{font-size:20px}.reason{margin:8px 0}.warning{border-color:#6b5525;background:#211d14;color:var(--warn)}.candidates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.stats div{background:#0e131d;border-radius:8px;padding:9px}.stats span{display:block;color:var(--muted);font-size:11px}.technical{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.error{color:var(--bad);white-space:pre-wrap}@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.hero,.candidates,.split{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="top"><div><h1 id="title">Исследование Grid</h1><div class="muted">Train 20 дней → независимый out-of-sample test 10 дней</div></div><a class="button" href="/profiles/new">← К профилю</a></header><div id="root" class="panel muted" style="margin-top:20px">Запускаем анализ 90 дней часовых свечей…</div></main><script>
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),fmt=(v,n=2)=>Number(v).toLocaleString('ru-RU',{maximumFractionDigits:n}),signed=v=>`${Number(v)>=0?'+':''}${fmt(v)}%`,params=new URLSearchParams(location.search),symbol=(params.get('symbol')||'BTCUSDT').toUpperCase(),profileId=params.get('profile_id');
async function run(){document.getElementById('title').textContent=`${symbol.replace(/USDT$/,'')} / USDT · исследование`;try{const response=await fetch('/api/grid-analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol,profile_id:profileId?Number(profileId):null})}),d=await response.json();if(!response.ok)throw new Error(d.detail||`HTTP ${response.status}`);const m=d.market,ind=m.indicators;document.getElementById('root').outerHTML=`${m.warning?`<section class="panel warning"><b>⚠ Grid сейчас имеет повышенный риск</b><div>Ниже всё равно показаны лучшие протестированные варианты.</div></section>`:''}<section class="panel"><div class="hero"><div class="metric"><span>Market regime</span><b>${esc(m.regime)}</b></div><div class="metric"><span>Grid suitability</span><b class="${m.warning?'bad':'good'}">${m.suitability} / 100</b></div><div class="metric"><span>Модель капитала</span><b>${d.analysis.capital_mode==='profile'?'Профиль':'1000 USDT'}</b></div></div><h3 style="margin-top:18px">Почему</h3>${m.reasons.map(x=>`<div class="reason">${m.warning?'•':'✓'} ${esc(x)}</div>`).join('')}<h3 style="margin:18px 0 10px">Рыночные показатели</h3><div class="technical"><div class="metric"><span>ADX</span><b>${fmt(ind.adx)}</b></div><div class="metric"><span>ATR, %</span><b>${fmt(ind.atr_pct)}%</b></div><div class="metric"><span>30d</span><b>${signed(ind.price_change_30d)}</b></div><div class="metric"><span>60d</span><b>${signed(ind.price_change_60d)}</b></div><div class="metric"><span>90d</span><b>${signed(ind.price_change_90d)}</b></div><div class="metric"><span>Realized volatility</span><b>${fmt(ind.realized_volatility)}%</b></div></div></section><section><h2 style="margin-bottom:12px">Лучшие варианты по TEST</h2><div class="candidates">${d.candidates.length?d.candidates.map(card).join(''):`<div class="panel bad">Подходящих конфигураций нет: ${esc(d.failure_reason)}</div>`}</div></section><section class="panel muted">Диапазоны и шаги рассчитаны только на TRAIN. TEST запускался отдельно, с теми же замороженными параметрами и без переноса открытых позиций. Учтены комиссия 0,1% и slippage 0,05%. Отклонено технически: ${d.rejected_candidates.length}.</section>`}catch(e){document.getElementById('root').className='panel error';document.getElementById('root').textContent=e.message}}
function period(label,x){return`<div><h3>${label}</h3><div class="stats"><div><span>Profit</span><b class="${Number(x.net_profit_pct)>=0?'good':'bad'}">${signed(x.net_profit_pct)}</b></div><div><span>Max DD</span><b>${fmt(x.max_drawdown_pct)}%</b></div><div><span>Cycles</span><b>${x.completed_cycles}</b></div><div><span>Score</span><b>${fmt(x.score)}</b></div><div><span>Fees</span><b>${fmt(x.fees)} USDT</b></div><div><span>Range breaks</span><b>${x.range_break_up_count+x.range_break_down_count}</b></div></div></div>`}
function card(c){return`<article class="card"><div class="row"><h2>Вариант #${c.rank}</h2><b class="${c.stability==='GOOD'?'good':c.stability==='LOW'?'bad':''}">${c.stability}</b></div><div class="hero"><div class="metric"><span>Диапазон</span><b>${fmt(c.range_low,8)} – ${fmt(c.range_high,8)}</b></div><div class="metric"><span>Grid Step</span><b>${fmt(c.step_pct)}%</b></div><div class="metric"><span>Levels</span><b>${c.levels}</b></div></div><div class="split">${period('TRAIN · 20 дней',c.train)}${period('TEST · 10 дней',c.test)}</div><div class="muted">Coverage ${fmt(c.coverage_pct)}% · score degradation ${fmt(c.score_degradation)}</div></article>`}run();
</script></body></html>
